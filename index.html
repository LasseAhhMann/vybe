<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>VYBE</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VYBE">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b0f">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#0b0b0f; --card:#16161d; --card2:#1f1f28; --line:#2a2a34; --text:#f4f4f6; --muted:#8d8d99;
  --acc:#d4ff3a; --acc-d:#b8e61c; --pink:#ff4d6d;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;touch-action:manipulation}
input,textarea{-webkit-user-select:text;user-select:text;font:inherit}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;transition:opacity .35s}
.logo{font-weight:900;letter-spacing:-1px;font-style:italic}
.logo i{color:var(--acc);font-style:italic}

/* ---------- LOGIN ---------- */
#login{align-items:center;justify-content:center;padding:calc(var(--sat) + 30px) 24px calc(var(--sab) + 30px);
  background:radial-gradient(1200px 600px at 80% -10%,rgba(212,255,58,.18),transparent 60%),radial-gradient(900px 600px at -10% 110%,rgba(255,77,109,.16),transparent 60%),var(--bg);overflow:hidden}
#login.out{opacity:0;pointer-events:none}
.lwrap{width:100%;max-width:460px;position:relative;z-index:2}
.lwrap .logo{font-size:84px;line-height:1;text-align:center}
.tag{text-align:center;color:#c9c9d2;font-size:20px;margin:10px 0 34px;font-weight:500}
.floaters{position:absolute;inset:0;pointer-events:none;opacity:.55}
.floaters div{position:absolute;width:150px;height:200px;border-radius:22px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.5);animation:float 7s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-16px) rotate(var(--r))}}
.field{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px;color:var(--muted)}
.field input{flex:1;border:0;background:none;outline:none;color:var(--text);font-size:18px;min-width:0}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:17px;border-radius:999px;font-weight:800;font-size:18px}
.btn.acc{background:var(--acc);color:#0b0b0f}
.btn.acc:active{background:var(--acc-d)}
.btn.ghost{background:var(--card);border:1px solid var(--line)}
.btn.white{background:#fff;color:#000}
.or{display:flex;align-items:center;gap:14px;color:var(--muted);margin:16px 0;font-size:13px;font-weight:700;letter-spacing:1px}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.small{color:var(--muted);font-size:14px;text-align:center;margin-top:16px}
.spinner{width:22px;height:22px;border:3px solid rgba(0,0,0,.2);border-top-color:currentColor;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- ONBOARDING ---------- */
#onb{padding:calc(var(--sat) + 40px) 24px calc(var(--sab) + 30px);align-items:center;overflow-y:auto;opacity:0}
#onb.in{opacity:1}
.owrap{width:100%;max-width:720px}
.owrap h1{font-size:44px;margin:12px 0 6px;letter-spacing:-1px}
.owrap p{color:var(--muted);font-size:18px;margin:0 0 26px}
.styles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.style{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px 16px;text-align:left;transition:.15s;position:relative}
.style .em{font-size:34px;display:block;margin-bottom:10px}
.style b{font-size:18px;display:block}
.style small{color:var(--muted);font-size:13px}
.style.on{border-color:var(--acc);background:#1d2210}
.style.on:after{content:"✓";position:absolute;right:12px;top:10px;width:26px;height:26px;border-radius:50%;background:var(--acc);color:#000;display:grid;place-items:center;font-weight:900;font-size:14px}
.loading{display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:20vh;text-align:center}
.loading .logo{font-size:60px}
.dots span{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--acc);margin:0 4px;animation:bounce 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes bounce{50%{transform:translateY(-10px);opacity:.5}}

/* ---------- MAIN ---------- */
#main{opacity:0}
#main.in{opacity:1}
.views{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--sat) + 22px) 22px calc(var(--sab) + 120px);display:none}
.view.on{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.wrap{max-width:1000px;margin:0 auto}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.head h2{font-size:36px;margin:0;letter-spacing:-.8px}
.sub{color:var(--muted);margin-top:2px}
.iconbtn{width:48px;height:48px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;position:relative;flex:none}
.badge{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;border-radius:99px;background:var(--acc);color:#000;font-size:12px;font-weight:900;display:grid;place-items:center;padding:0 6px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{padding:10px 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:15px;white-space:nowrap}
.chip.on{background:var(--acc);color:#000;border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px}
.sec{font-size:22px;font-weight:800;margin:28px 0 12px}

/* tabbar */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 14px);width:min(560px,calc(100% - 28px));
  background:rgba(22,22,29,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:30px;display:flex;align-items:center;padding:8px;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:#7c7c88;font-size:12px;font-weight:700}
.tabbar button svg{width:26px;height:26px}
.tabbar button.on{color:var(--text)}
.tabbar button.on svg{color:var(--acc)}
.tabbar .plus{flex:none;width:58px;height:46px;border-radius:16px;background:var(--acc);color:#000;display:grid;place-items:center;margin:0 6px}
.tabbar .plus svg{width:28px;height:28px;stroke-width:2.6;color:#000!important}

/* FEED */
#v-feed{padding:0;overflow:hidden}
.topbar{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:calc(var(--sat) + 14px) 22px 14px;background:linear-gradient(var(--bg) 40%,rgba(11,11,15,0))}
.topbar .logo{font-size:32px;width:120px}
.ftabs{display:flex;gap:22px;font-weight:800;font-size:18px;color:var(--muted)}
.ftabs button.on{color:var(--text);position:relative}
.ftabs button.on:after{content:"";position:absolute;left:20%;right:20%;bottom:-8px;height:3px;border-radius:9px;background:var(--acc)}
.topbar .right{width:120px;display:flex;justify-content:flex-end}
#feed{position:absolute;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
.slide{height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;gap:22px;padding:calc(var(--sat) + 76px) 20px calc(var(--sab) + 108px)}
.artw{position:relative;height:100%;aspect-ratio:3/4;max-width:100%;border-radius:28px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5);flex:none}
.artw>svg.art{width:100%;height:100%;display:block}
.ovl{position:absolute;left:0;right:0;bottom:0;padding:60px 20px 20px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.6) 50%,rgba(0,0,0,.75));color:#fff}
.creator{display:flex;align-items:center;gap:10px;font-weight:800}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#000;flex:none;font-size:15px}
.follow{padding:6px 12px;border-radius:999px;border:1.5px solid #fff;font-size:13px;font-weight:800}
.follow.on{background:#fff;color:#000}
.otitle{font-size:24px;font-weight:900;margin:10px 0 4px;letter-spacing:-.3px}
.why{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--acc);margin-bottom:12px}
.shopbtn{display:flex;align-items:center;justify-content:space-between;width:100%;background:rgba(255,255,255,.96);color:#000;border-radius:18px;padding:13px 16px;font-weight:800}
.shopbtn .thumbs{display:flex}
.shopbtn .thumbs span{width:36px;height:36px;border-radius:10px;background:#f1f1f3;margin-left:-8px;border:2px solid #fff;display:grid;place-items:center;overflow:hidden}
.shopbtn .thumbs span:first-child{margin-left:0}
.shopbtn .thumbs svg{width:30px;height:30px}
.rail{position:absolute;right:14px;bottom:170px;display:flex;flex-direction:column;gap:16px;align-items:center;z-index:2}
.rail button{display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;font-size:12px;font-weight:800;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.rail .c{width:54px;height:54px;border-radius:50%;background:rgba(0,0,0,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;place-items:center}
.rail .c svg{width:27px;height:27px}
.rail .liked .c{color:var(--pink)}
.rail .liked .c svg{fill:currentColor}
.rail .saved .c{color:var(--acc)}
.rail .saved .c svg{fill:currentColor}
.rail .find .c{background:var(--acc);color:#000}
.bigheart{position:absolute;left:50%;top:45%;font-size:130px;transform:translate(-50%,-50%) scale(0);pointer-events:none;animation:pop .8s ease forwards;filter:drop-shadow(0 6px 20px rgba(0,0,0,.4))}
@keyframes pop{30%{transform:translate(-50%,-50%) scale(1.15)}60%{transform:translate(-50%,-50%) scale(1)}100%{transform:translate(-50%,-70%) scale(1);opacity:0}}
.side{display:none;width:390px;max-height:100%;overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:18px;flex:none}
@media (min-width:1000px) and (orientation:landscape){.side{display:block}.artw .shopbtn{display:none}.rail{bottom:120px}}
.hint{position:absolute;left:50%;bottom:calc(var(--sab) + 120px);transform:translateX(-50%);background:rgba(0,0,0,.6);padding:8px 14px;border-radius:99px;font-size:13px;font-weight:700;z-index:4;animation:hint 2.4s ease 1s both;pointer-events:none}
@keyframes hint{0%{opacity:0}15%,75%{opacity:1}100%{opacity:0}}
.learn{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px}
.learn .card{max-width:520px}

/* shop list */
.shop h3{margin:0;font-size:22px;letter-spacing:-.3px}
.cheap{display:flex;align-items:center;gap:12px;background:var(--card2);border-radius:16px;padding:12px 14px;margin:14px 0 6px}
.cheap .t{flex:1;font-weight:700;font-size:15px}
.cheap .t small{display:block;color:var(--muted);font-weight:500;font-size:13px}
.toggle{width:52px;height:32px;border-radius:99px;background:#3a3a46;position:relative;transition:.2s;flex:none}
.toggle:after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on{background:var(--acc)}
.toggle.on:after{left:23px;background:#000}
.prow{display:flex;align-items:center;gap:12px;padding:11px 0}
.prow+.prow{border-top:1px solid var(--line)}
.pth{width:62px;height:62px;border-radius:16px;background:#ececef;display:grid;place-items:center;flex:none;overflow:hidden}
.pth svg{width:54px;height:54px}
.prow .t{flex:1;min-width:0}
.prow .t b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .t small{color:var(--muted);font-size:13px}
.price{font-weight:900;font-size:17px;text-align:right;white-space:nowrap}
.price s{display:block;color:var(--muted);font-weight:600;font-size:12px}
.addb{width:38px;height:38px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.addb svg{width:18px;height:18px}
.addb.in{background:var(--acc);color:#000;border-color:var(--acc)}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 14px;padding-top:14px;border-top:1px dashed var(--line)}
.total b{font-size:26px;letter-spacing:-.5px}
.save{color:var(--acc);font-weight:800;font-size:14px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns .btn{font-size:16px;padding:15px}
.aff{color:var(--muted);font-size:12px;text-align:center;margin-top:12px}

/* grids */
.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.ocard{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.ocard svg.art{width:100%;display:block;aspect-ratio:3/4}
.ocard .b{padding:12px 14px}
.ocard .b b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ocard .b small{color:var(--muted)}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;color:var(--muted)}
.search input{flex:1;background:none;border:0;outline:none;color:var(--text);font-size:18px;min-width:0}
.upload{position:relative;display:flex;align-items:center;gap:18px;background:linear-gradient(135deg,#1d2210,#16161d 60%);border:1px solid #3a4a12;border-radius:26px;padding:22px;overflow:hidden;width:100%;text-align:left}
.upload input{position:absolute;inset:0;opacity:0}
.upload .ic{width:70px;height:70px;border-radius:22px;background:var(--acc);color:#000;display:grid;place-items:center;flex:none}
.upload .ic svg{width:36px;height:36px}
.upload b{font-size:21px;display:block}
.upload span{color:#c9c9d2}

/* find */
.scan{position:relative;border-radius:22px;overflow:hidden;background:#ececef}
.scan svg.art,.scan img{width:100%;display:block}
.scan img{max-height:520px;object-fit:cover}
.scanline{position:absolute;left:0;right:0;height:90px;top:-90px;background:linear-gradient(rgba(212,255,58,0),rgba(212,255,58,.55));border-bottom:3px solid var(--acc);animation:scan 1.5s ease-in-out 1}
@keyframes scan{to{top:100%}}
.boxes{position:absolute;inset:0}
.box{position:absolute;border:3px solid var(--acc);border-radius:14px;opacity:0;animation:boxin .4s ease forwards}
.box span{position:absolute;left:-3px;top:-30px;background:var(--acc);color:#000;font-weight:800;font-size:13px;padding:4px 9px;border-radius:9px;white-space:nowrap}
@keyframes boxin{from{opacity:0;transform:scale(1.1)}to{opacity:1;transform:none}}
.found{margin-top:18px}
.found h4{margin:18px 0 10px;font-size:17px;display:flex;align-items:center;gap:8px}
.found h4 small{color:var(--acc);font-weight:700}
.sim{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.sim::-webkit-scrollbar{display:none}
.simc{flex:none;width:150px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;text-align:left}
.simc .pth{width:100%;height:110px;border-radius:12px}
.simc .pth svg{width:90px;height:90px}
.simc b{display:block;font-size:14px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.simc small{color:var(--muted);font-size:12px}
.simc .pr{font-weight:900;margin-top:4px;display:flex;justify-content:space-between;align-items:center}
.note{background:#1d2210;border:1px solid #3a4a12;color:#e7ffa0;border-radius:14px;padding:10px 14px;font-size:14px;margin-bottom:10px}

/* create */
.crt{display:grid;grid-template-columns:minmax(260px,380px) minmax(0,1fr);gap:20px;align-items:start}
.crt>div{min-width:0}
@media (max-width:860px){.crt{grid-template-columns:1fr}.crt .prev{max-width:360px;margin:0 auto}}
.prev{border-radius:24px;overflow:hidden;position:sticky;top:0}
.prev svg{width:100%;display:block}
.inp{width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;color:var(--text);font-size:18px;outline:none}
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin-top:12px}
.citem{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:8px;text-align:left}
.citem .pth{width:100%;height:90px;border-radius:12px}
.citem .pth svg{width:76px;height:76px}
.citem b{display:block;font-size:13px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.citem small{color:var(--muted);font-size:12px}
.citem.on{border-color:var(--acc)}

/* profile */
.prof{display:flex;align-items:center;gap:18px}
.prof .av{width:88px;height:88px;font-size:34px}
.stats{display:flex;gap:26px;margin-top:8px}
.stats b{font-size:20px;display:block}
.stats span{color:var(--muted);font-size:13px}
.sbar{display:flex;align-items:center;gap:12px;margin:10px 0}
.sbar span{width:120px;font-weight:700;font-size:15px}
.sbar .bar{flex:1;height:12px;border-radius:99px;background:var(--card2);overflow:hidden}
.sbar .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc),#7dffb0);transition:width .6s}
.sbar em{width:46px;text-align:right;font-style:normal;color:var(--muted);font-weight:700}
.plus-card{background:linear-gradient(135deg,#d4ff3a,#7dffb0);color:#0b0b0f;border-radius:26px;padding:22px;position:relative;overflow:hidden}
.plus-card h3{margin:0;font-size:26px;font-weight:900;letter-spacing:-.5px}
.plus-card ul{margin:12px 0 16px;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-weight:600;font-size:15px}
.plus-card li:before{content:"✓ ";font-weight:900}
.plus-card .btn{background:#0b0b0f;color:#fff}
.setr{display:flex;align-items:center;gap:14px;padding:14px 0}
.setr+.setr{border-top:1px solid var(--line)}
.setr .t{flex:1;font-weight:700}
.setr .t small{display:block;font-weight:400;color:var(--muted)}

/* sheet & toast */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.3s;z-index:40}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:min(720px,100%);max-height:calc(100% - var(--sat) - 26px);background:#121218;border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;z-index:41;transition:transform .35s cubic-bezier(.2,.9,.3,1);display:flex;flex-direction:column}
#sheet.on{transform:translate(-50%,0)}
.grab{width:44px;height:5px;border-radius:9px;background:#3a3a46;margin:10px auto 4px}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:6px 22px 10px}
.sh-head h3{margin:0;font-size:22px}
.xbtn{width:36px;height:36px;border-radius:50%;background:var(--card2);display:grid;place-items:center}
.xbtn svg{width:18px;height:18px}
.sh-body{overflow-y:auto;padding:4px 22px calc(var(--sab) + 26px)}
#toast{position:fixed;left:50%;top:calc(var(--sat) + 16px);transform:translate(-50%,-250%);opacity:0;background:#fff;color:#000;padding:13px 20px;border-radius:999px;font-weight:700;z-index:60;transition:.35s cubic-bezier(.2,.9,.3,1);max-width:92%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#toast.on{transform:translate(-50%,0);opacity:1}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="login" class="screen">
  <div class="floaters" id="floaters"></div>
  <div class="lwrap">

let feedCount=0;
function ranked(){
  const list=state.feedMode==='fl'?OUTFITS.filter(o=>state.following.has(o.by)||o.mine):OUTFITS;
  const sc=o=>(state.w[o.style]||0)+(o.id===1?.4:0);
  return [...list].sort((a,b)=>sc(b)-sc(a)||b.likes-a.likes);
}

function buildFeed(){
  feedCount=0;const f=$('#feed');

    :`<div class="slide learn"><div class="card"><div style="font-size:44px">👀</div><h2 style="margin:6px 0">Du følger ingen endnu</h2><p class="sub">Tryk “+ Følg” på et outfit i “For dig”.</p></div></div>`;

  observeMore();
}
let io;
function observeMore(){
  io&&io.disconnect();const more=$('#more');if(!more)return;
  io=new IntersectionObserver(es=>{if(es[0].isIntersecting){
    const html=ranked().map(slideHTML).join('');more.insertAdjacentHTML('beforebegin',html);
    toast('Nye outfits – sorteret efter din stil');}},{root:$('#feed'),threshold:.6});
  io.observe(more);
}

    ${o.items.map((it,i)=>{const nm=ch?it.name:it.name, br=ch?ALTBRANDS[(i+o.id)%ALTBRANDS.length]:it.brand, pr=ch?it.alt:it.price;
      const key=o.id+'-'+i+(ch?'c':''); const inCart=state.cart.some(c=>c.key===key);
      return `<div class="prow"><div class="pth">${thumb(ch?{...it,color:shade(it.color,8)}:it)}</div>

}

function addToCart(o,i){
  const ch=!!state.cheap[o.id],it=o.items[i],key=o.id+'-'+i+(ch?'c':'');
  if(state.cart.some(c=>c.key===key)){state.cart=state.cart.filter(c=>c.key!==key);}
  else{const br=ch?ALTBRANDS[(i+o.id)%ALTBRANDS.length]:it.brand;state.cart.push({key,item:ch?{...it,color:shade(it.color,8)}:it,name:it.name,brand:br,price:ch?it.alt:it.price});learn(o.style,1.5);}
}

/* ---------------- LEARNING ---------------- */
function learn(style,amt){
  const before=state.w[style]||0;state.w[style]=before+amt;
  if(state.w[style]>=4&&!state.learned.has(style)&&!state.styles.has(style)){state.learned.add(style);setTimeout(()=>toast(`VYBE lærer din stil: mere ${style} i dit feed 🔥`),700);}
  else if(state.w[style]>=6&&!state.learned.has(style+'+')){state.learned.add(style+'+');setTimeout(()=>toast(`Du elsker ${style} – vi viser dig flere looks 🔥`),700);}
}

/* ---------------- FIND TØJET ---------------- */
function similar(it,o){
  const p=it.price;let prices=p>=2000?[649,899,1199]:[Math.round(p*.55/10)*10-1,Math.round(p*.8/10)*10-1,Math.round(p*1.1/10)*10-1];
  const cols=[it.color,shade(it.color,18),shade(it.color,-18)];
  return prices.map((pr,k)=>({item:{...it,color:cols[k]},name:G[it.type].label+(k===0?' – tæt match':k===1?' – lignende':' – alternativ'),brand:ALTBRANDS[(k+o.id+p)%ALTBRANDS.length],price:pr}));
}
let simStore=[];
function openFind(id){
  const o=byId(id);simStore=[];
  const boxes=o.items.map((it,k)=>{const r=slotRect(G[it.type].slot,it.type);const pct=v=>v;return `<div class="box" style="left:${r[0]/3}%;top:${r[1]/4}%;width:${r[2]/3}%;height:${r[3]/4}%;animation-delay:${1.5+k*.25}s"><span>${G[it.type].em} ${G[it.type].label} · ${96-k*3}%</span></div>`;}).join('');
  openSheet('Find tøjet',`<div class="scan" style="max-width:440px;margin:0 auto">${art(o)}<div class="scanline"></div><div class="boxes">${boxes}</div></div>
    <div class="found" id="found"><div class="sub" style="text-align:center;margin-top:16px">🔍 Analyserer billedet…</div></div>`);
  setTimeout(()=>{const f=$('#found');if(!f)return;
    f.innerHTML=`<div style="font-size:20px;font-weight:900;margin-top:6px">Vi fandt ${o.items.length} dele</div><div class="sub">Det behøver ikke være præcis samme produkt – her er det, der ligner mest.</div>`+
    o.items.map(it=>{const sims=similar(it,o);const base=simStore.length;simStore.push(...sims);
      return `<h4>${G[it.type].em} ${G[it.type].label} <small>${it.brand} ${it.name} · ${kr(it.price)}</small></h4>
      ${it.price>=2000?`<div class="note">💡 Originalen koster ca. ${kr(it.price)}. Lignende ${G[it.type].label.toLowerCase()} fra 600–1.200 kr.</div>`:''}
      <div class="sim">${sims.map((s,k)=>`<div class="simc"><div class="pth">${thumb(s.item)}</div><b>${s.name}</b><small>${s.brand}</small><div class="pr">${kr(s.price)}<button class="addb" data-a="addsim" data-k="${base+k}">${ic('plus')}</button></div></div>`).join('')}</div>`;}).join('');
  },2600);
}

  run();
}
function ocard(o){return `<button class="ocard" data-a="detail" data-id="${o.id}">${art(o)}<div class="b"><b>${o.title}</b><small>@${o.by} · ${kr(total(o))}</small></div></button>`;}
function photoFind(src){
  simStore=[];
  const det=[{t:'hoodie',l:'Overdel',x:24,y:16,w:52,h:34,c:'#7d7f84'},{t:'jeans',l:'Bukser',x:30,y:48,w:40,h:36,c:'#5a7aa5'},{t:'sneaker',l:'Sko',x:28,y:84,w:44,h:12,c:'#f2f2f2'}];
  openSheet('Find tøjet',`<div class="scan" style="max-width:440px;margin:0 auto"><img src="${src}"><div class="scanline"></div><div class="boxes">${det.map((d,k)=>`<div class="box" style="left:${d.x}%;top:${d.y}%;width:${d.w}%;height:${d.h}%;animation-delay:${1.5+k*.25}s"><span>${d.l} · ${93-k*4}%</span></div>`).join('')}</div></div>
  <div class="found" id="found"><div class="sub" style="text-align:center;margin-top:16px">🔍 Analyserer billedet…</div></div>`);
  setTimeout(()=>{const f=$('#found');if(!f)return;const fake={id:3};
    f.innerHTML=`<div style="font-size:20px;font-weight:900;margin-top:6px">Vi fandt 3 dele</div><div class="sub">Lignende produkter fra butikker, VYBE samarbejder med.</div>`+
    det.map(d=>{const it={type:d.t,color:d.c,price:d.t==='sneaker'?799:d.t==='jeans'?449:399};const sims=similar(it,fake);const base=simStore.length;simStore.push(...sims);
      return `<h4>${G[d.t].em} ${d.l}</h4><div class="sim">${sims.map((s,k)=>`<div class="simc"><div class="pth">${thumb(s.item)}</div><b>${s.name}</b><small>${s.brand}</small><div class="pr">${kr(s.price)}<button class="addb" data-a="addsim" data-k="${base+k}">${ic('plus')}</button></div></div>`).join('')}</div>`;}).join('');
  },2600);
}

/* ---------------- OPRET ---------------- */
let draft={title:'',style:'Streetwear',items:{}};
function catalog(){
  const c={top:[],bottom:[],shoes:[],bag:[],acc:[]},seen=new Set();
  OUTFITS.filter(o=>!o.mine).forEach(o=>o.items.forEach(it=>{const k=it.name+it.color;if(seen.has(k))return;seen.add(k);c[G[it.type].slot].push(it);}));
  return c;
}
let catTab='top';
function renderCreate(){
  const C=catalog();
  const cur=Object.values(draft.items);const tot=cur.reduce((a,i)=>a+i.price,0);
  const prevO={bg:['#efe9df','#ddd3c4'],items:cur};
  $('#v-create').innerHTML=`<div class="wrap">
    <div class="head"><div><h2>Lav et outfit</h2><div class="sub">Sæt produkter sammen og del dit look med andre</div></div></div>
    <div class="crt">
      <div><div class="prev">${cur.length?art(prevO):`<svg viewBox="0 0 300 400" style="background:#1f1f28"><text x="150" y="190" text-anchor="middle" fill="#8d8d99" font-size="16" font-family="-apple-system,sans-serif" font-weight="700">Vælg tøj til højre</text><text x="150" y="215" text-anchor="middle" fill="#8d8d99" font-size="13" font-family="-apple-system,sans-serif">dit outfit bygges her</text></svg>`}</div>
        <div class="total" style="border:0;margin-top:10px"><span class="sub">${cur.length} dele</span><b>${kr(tot)}</b></div></div>
      <div>
        <input class="inp" id="dTitle" placeholder="Giv dit outfit et navn, fx “Autumn streetwear 🍂”" value="${draft.title.replace(/"/g,'&quot;')}">
        <div class="chips" style="margin-top:12px" id="dStyle">${STYLES.map(s=>`<button class="chip ${draft.style===s[0]?'on':''}" data-s="${s[0]}">${s[1]} ${s[0]}</button>`).join('')}</div>
        <div class="chips" style="margin-top:18px" id="dTab">${[['top','👕 Overdel'],['bottom','👖 Underdel'],['shoes','👟 Sko'],['bag','👜 Taske'],['acc','🧢 Tilbehør']].map(t=>`<button class="chip ${catTab===t[0]?'on':''}" data-t="${t[0]}">${t[1]}</button>`).join('')}</div>
        <div class="cat">${C[catTab].map((it,k)=>`<button class="citem ${draft.items[catTab]===it?'on':''}" data-k="${k}"><div class="pth">${thumb(it)}</div><b>${it.name}</b><small>${it.brand} · ${kr(it.price)}</small></button>`).join('')}</div>
        <button class="btn acc" id="dPub" style="margin-top:20px">${ic('share')} Del outfit</button>
      </div>
    </div></div>`;
  $('#dTitle').oninput=e=>draft.title=e.target.value;
  $('#dStyle').onclick=e=>{const b=e.target.closest('button');if(b){draft.style=b.dataset.s;renderCreate();}};
  $('#dTab').onclick=e=>{const b=e.target.closest('button');if(b){catTab=b.dataset.t;renderCreate();}};
  $$('#v-create .citem').forEach(b=>b.onclick=()=>{const it=C[catTab][+b.dataset.k];draft.items[catTab]===it?delete draft.items[catTab]:draft.items[catTab]=it;renderCreate();});
  $('#dPub').onclick=()=>{
    const items=Object.values(draft.items);if(items.length<2){toast('Vælg mindst 2 dele til dit outfit');return;}
    const bgs=[['#efe9df','#ddd3c4'],['#e6edf2','#d0dbe5'],['#f3e6ee','#e2cfe0'],['#e7eee2','#cfdcc8']];
    const o={id:100+state.mine.length,title:draft.title.trim()||`Mit ${draft.style.toLowerCase()} look`,style:draft.style,by:state.name.toLowerCase(),bg:bgs[state.mine.length%4],likes:0,mine:true,items};
    OUTFITS.push(o);state.mine.push(o.id);draft={title:'',style:'Streetwear',items:{}};
    $('#feed').insertAdjacentHTML('afterbegin',slideHTML(o));
    renderCreate();switchView('feed');$('#feed').scrollTop=0;toast('Dit outfit er delt! Andre kan nu like, gemme og shoppe det 🎉');
  };
}

/* ---------------- GEMT ---------------- */
function renderSaved(){
  const s=OUTFITS.filter(o=>state.saved.has(o.id));
  $('#v-saved').innerHTML=`<div class="wrap">
    <div class="head"><div><h2>Gemt</h2><div class="sub">${s.length} looks · samlet værdi ${kr(s.reduce((a,o)=>a+total(o),0))}</div></div>${cartBtn()}</div>
    ${s.length?`<div class="ogrid">${s.map(ocard).join('')}</div>`:`<div class="card" style="text-align:center"><div style="font-size:40px">🔖</div><b>Ingen gemte looks endnu</b><div class="sub">Tryk på bogmærket i feedet</div></div>`}
    ${state.plus?'':`<div class="card" style="margin-top:20px;display:flex;align-items:center;gap:14px">${ic('bell','color:var(--acc)')}<div style="flex:1"><b>Prisalarm på dine gemte looks</b><div class="sub" style="font-size:14px">Få besked når et produkt falder i pris – med Style+</div></div><button class="chip on" data-a="plus">Prøv</button></div>`}
  </div>`;
}

/* ---------------- PROFIL ---------------- */
function renderProfile(){
  const W=STYLES.map(s=>[s[0],s[1],state.w[s[0]]||0]).sort((a,b)=>b[2]-a[2]);const sum=W.reduce((a,x)=>a+x[2],0)||1;
  const mine=OUTFITS.filter(o=>o.mine);
  $('#v-profile').innerHTML=`<div class="wrap">
    <div class="head"><h2>Profil</h2>${cartBtn()}</div>
    <div class="card prof"><span class="av" style="background:var(--acc)">${state.name[0]}</span>
      <div style="flex:1"><div style="font-size:26px;font-weight:900">${state.name}</div><div class="sub">@${state.name.toLowerCase()} ${state.plus?'· <b style="color:var(--acc)">Style+</b>':''}</div>
      <div class="stats"><div><b>${mine.length}</b><span>outfits</span></div><div><b>${128+state.following.size*0}</b><span>følgere</span></div><div><b>${state.following.size}</b><span>følger</span></div><div><b>${state.liked.size}</b><span>likes</span></div></div></div></div>
    <div class="sec">Din stil <span class="sub" style="font-size:15px;font-weight:500">– VYBE lærer af dine likes og gem</span></div>
    <div class="card">${W.slice(0,5).map(x=>`<div class="sbar"><span>${x[1]} ${x[0]}</span><div class="bar"><i style="width:${Math.round(x[2]/W[0][2]*100)}%"></i></div><em>${Math.round(x[2]/sum*100)}%</em></div>`).join('')}</div>
    <div class="sec">Mine outfits</div>
    ${mine.length?`<div class="ogrid">${mine.map(ocard).join('')}</div>`:`<button class="card" style="width:100%;text-align:center" onclick="switchView('create')"><div style="font-size:36px">➕</div><b>Lav dit første outfit</b><div class="sub">Sæt produkter sammen og del det med andre</div></button>`}
    <div class="sec">Style+</div>
    <div class="plus-card"><h3>Style+ ${state.plus?'· aktiv ✓':'· 29 kr./md.'}</h3>
      <ul><li>Personlige outfit-forslag</li><li>Prisalarmer</li><li>Find billigere alternativ</li><li>AI-styling</li><li>Din digitale garderobe</li><li>Ingen reklamer</li></ul>
      <button class="btn" data-a="plus">${state.plus?'Administrér abonnement':'Prøv gratis i 7 dage'}</button></div>
    <div class="sec">Indstillinger</div>
    <div class="card" style="padding-top:4px;padding-bottom:4px">
      <div class="setr"><div class="t">Prisalarmer<small>Besked når gemte produkter falder i pris</small></div><button class="toggle ${state.alarms?'on':''}" data-a="alarms"></button></div>
      <div class="setr"><div class="t">Skift stilarter<small>${[...state.styles].join(', ')}</small></div><button class="chip" data-a="restyle">Ændr</button></div>
    </div>
    <button class="btn ghost" data-a="logout" style="margin-top:22px;color:var(--pink)">${ic('logout')} Log ud</button>
    <div class="sub" style="text-align:center;margin-top:16px;font-size:13px">VYBE · demo-version · alle produkter og brands er opdigtede</div>
  </div>`;
}

/* ---------------- KURV ---------------- */
function openCart(){
  const t=state.cart.reduce((a,c)=>a+c.price,0);const shops=new Set(state.cart.map(c=>c.brand));
  openSheet('Din kurv',state.cart.length?`${state.cart.map((c,k)=>`<div class="prow"><div class="pth">${thumb(c.item)}</div><div class="t"><b>${c.name}</b><small>${c.brand} · ${SHOPS[c.brand]}</small></div><div class="price">${kr(c.price)}</div><button class="addb" data-a="rm" data-k="${k}">${ic('trash')}</button></div>`).join('')}
    <div class="total"><span class="sub">${state.cart.length} varer fra ${shops.size} butik${shops.size>1?'ker':''}</span><b>${kr(t)}</b></div>
    <button class="btn acc" data-a="checkout">Gå til butikkerne ${ic('ext')}</button>
    <div class="aff">I version 1 sendes du videre til den enkelte webshop for at betale.</div>`
    :`<div style="text-align:center;padding:30px 0"><div style="font-size:44px">🛍️</div><b>Kurven er tom</b><div class="sub">Tryk “Shop looket” på et outfit</div></div>`);
}

/* ---------------- GLOBAL ACTIONS ---------------- */
let lastTap={t:0,id:null};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,id=+el.dataset.id;
  if(a==='dbl'){const now=Date.now();if(lastTap.id===id&&now-lastTap.t<320){doLike(id,el,true);lastTap={t:0,id:null};}else lastTap={t:now,id};return;}
  e.stopPropagation();
  switch(a){
    case 'close':closeSheet();break;
    case 'like':doLike(id,el.closest('.artw'));break;
    case 'save':{const o=byId(id);const on=!state.saved.has(id);on?state.saved.add(id):state.saved.delete(id);
      $$(`[data-a=save][data-id="${id}"]`).forEach(b=>b.classList.toggle('saved',on));
      if(on){learn(o.style,2);toast('Gemt i dine looks 🔖');}break;}
    case 'follow':{const by=el.dataset.by;const on=!state.following.has(by);on?state.following.add(by):state.following.delete(by);
      $$(`[data-a=follow][data-by="${by}"]`).forEach(b=>{b.classList.toggle('on',on);b.textContent=on?'Følger':'+ Følg';});if(on)toast(`Du følger nu @${by}`);break;}
    case 'share':toast('Link kopieret – del looket med dine venner');break;
    case 'shop':openShop(id);break;
    case 'detail':openDetail(id);break;
    case 'find':openFind(id);break;
    case 'cheap':{state.cheap[id]=!state.cheap[id];refreshShop(id);if(state.cheap[id])toast(`Billigere alternativ: ${kr(total(byId(id),true))} for hele looket`);break;}
    case 'add':{const o=byId(id);addToCart(o,+el.dataset.i);refreshShop(id);refreshCart();break;}
    case 'addall':{const o=byId(id);let n=0;o.items.forEach((it,i)=>{const key=o.id+'-'+i+(state.cheap[id]?'c':'');if(!state.cart.some(c=>c.key===key)){addToCart(o,i);n++;}});
      refreshShop(id);refreshCart();toast(n?`${n} varer lagt i kurven · ${kr(total(o,!!state.cheap[id]))}`:'Hele looket ligger allerede i kurven');break;}
    case 'addsim':{const s=simStore[+el.dataset.k];state.cart.push({key:'s'+Date.now()+Math.random(),item:s.item,name:s.name,brand:s.brand,price:s.price});el.classList.add('in');el.innerHTML=ic('check');refreshCart();toast('Lagt i kurven');break;}
    case 'cart':openCart();break;
    case 'rm':state.cart.splice(+el.dataset.k,1);refreshCart();openCart();$$('.side').forEach(s=>s.innerHTML=shopHTML(byId(s.dataset.shop)));break;
    case 'checkout':closeSheet();toast(`Du sendes videre til ${new Set(state.cart.map(c=>c.brand)).size} webshops (demo)`);break;
    case 'plus':state.plus=!state.plus;renderProfile();renderSaved();toast(state.plus?'Style+ er aktiveret – 7 dage gratis ✨':'Style+ er opsagt');break;
    case 'alarms':state.alarms=!state.alarms;el.classList.toggle('on',state.alarms);break;
    case 'restyle':$('#main').classList.remove('in');setTimeout(()=>{$('#main').classList.add('hidden');showOnb();},300);break;
    case 'logout':closeSheet();state.cart=[];$('#main').classList.remove('in');setTimeout(()=>{$('#main').classList.add('hidden');const l=$('#login');l.classList.remove('hidden');requestAnimationFrame(()=>l.classList.remove('out'));$('#pw').value='';},300);break;
  }
});
function doLike(id,artw,fromDbl){
  const o=byId(id);const on=fromDbl?true:!state.liked.has(id);
  if(on&&!state.liked.has(id))learn(o.style,1);
  on?state.liked.add(id):state.liked.delete(id);
  $$(`[data-a=like][data-id="${id}"]`).forEach(b=>{b.classList.toggle('liked',on);b.querySelector('.lc').textContent=kFmt(o.likes+(on?1:0));});
  if(on&&artw){const h=document.createElement('div');h.className='bigheart';h.textContent='❤️';artw.appendChild(h);setTimeout(()=>h.remove(),850);}
}
document.addEventListener('gesturestart',e=>e.preventDefault());
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
